name: MailChannels e2e

on:
  push:
    branches:
      - "agent/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
      - name: Tests and magic-link behaviour script
        run: mailchannels-e2e/ci.sh
      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mailchannels-e2e
          path: |
            mailchannels-e2e/out/*.json
            mailchannels-e2e/out/*.log
